name: CI (Next.js)

# The Next.js app that will replace the Rails app. Runs alongside ci.yml, which
# still covers the Rails side, until the follow-up PR removes Rails and this
# becomes the only CI workflow.

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '10.17.1'

on:
  pull_request:
  push:
    branches: [main]

jobs:
  next:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # No registry auth is needed: the droplet SDK is a `link:` dependency on
      # the vendored copy in ./vendor/droplet-sdk, because it is not published
      # yet. See vendor/droplet-sdk/README.md.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Needed before typecheck and build: the generated client is what gives
      # the Prisma models their types.
      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # No DATABASE_URL: the build compiles route handlers without evaluating
      # runtime environment. If this ever needs a live database, that is a bug
      # in a module doing work at import time.
      - name: Build
        run: pnpm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Next image
        # Load rather than push: this only proves the Dockerfile is valid.
        run: docker build -f Dockerfile.next -t droplet-newulife-payment-next:ci .

      # A built image is not a working image. The standalone bundle inherits
      # this repo's `"type": "module"`, which made Node parse Next's CommonJS
      # server.js as ESM and kill the container on its first line — while this
      # job stayed green, because it never started one.
      #
      # /api/health deliberately touches no database, so this needs no services.
      - name: Boot the image and require it to serve
        run: |
          set -euo pipefail
          docker run -d --name next-boot -p 3000:3000 \
            -e AUTH_SECRET=ci-boot-check-not-a-real-secret \
            -e AUTH_TRUST_HOST=true \
            droplet-newulife-payment-next:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "container answered /api/health after ${i}s"
              docker rm -f next-boot >/dev/null
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=next-boot)" ]; then
              echo "::error::the container exited before serving a request"
              docker logs next-boot
              exit 1
            fi
            sleep 1
          done

          echo "::error::container never answered /api/health within 30s"
          docker logs next-boot
          exit 1
